name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  api:
    name: API tests (Node 26)
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm
    timeout-minutes: 15
    env:
      CI: true
      API_URL: ${{ vars.API_URL || 'https://api.realworld.show' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run API tests
        id: tests
        run: npm run test:api

      - name: Upload API reports and traces
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error
