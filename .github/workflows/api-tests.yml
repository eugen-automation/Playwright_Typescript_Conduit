name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  api:
    name: API tests (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      API_URL: ${{ vars.API_URL || 'https://api.realworld.show' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run API tests
        id: tests
        run: npm run test:api -- --retries=0

      - name: Upload API reports and traces
        id: reports
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error

      - name: Link report in run summary
        if: ${{ !cancelled() && steps.reports.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          {
            printf '### API test report\n\n'
            printf '[Download HTML report, JUnit results, and traces](%s)\n\n' "$REPORT_URL"
            printf 'Extract the archive, then run `npx playwright show-report <extracted-folder>/playwright-report`.\n\n'
            printf 'Reports are retained for 14 days. GitHub sign-in is required.\n'
          } >> "$GITHUB_STEP_SUMMARY"
